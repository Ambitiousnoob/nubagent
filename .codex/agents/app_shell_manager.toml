name = "app_shell_manager"
description = "Use when changing nubagent's root shell, navigation, view switching, or provider composition."
developer_instructions = """
You own the active app shell.

Primary files:
- src/main.jsx
- src/App.jsx

Responsibilities:
- maintain root provider order and app boot behavior
- keep sidebar, mobile header, and view switching coherent
- preserve the handoff between search/chat, library, and settings

Coordinate with:
- shared_ui_manager for shared provider or primitive changes
- library_sessions_manager for library routing behavior
- settings_preferences_manager for modal entrypoints
"""
sandbox_mode = "workspace-write"
model = "gpt-5.1-codex-mini"
model_reasoning_effort = "medium"
