        margin-bottom: var(--spacing-sm);
        color: var(--color-text-primary);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      @media (max-width: 1180px) {
        .docs-page__hero,
        .docs-section__header,
        .docs-endpoints,
        .docs-framework-grid,
        .docs-examples,
        .docs-creation-grid,
        .docs-subagents {
          grid-template-columns: 1fr;
        }

        .docs-page__stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 768px) {
        .docs-page {
          padding: calc(var(--header-height) + var(--spacing-lg))
            var(--spacing-md) var(--spacing-xl);
        }

        .docs-page__hero,
        .docs-card,
        .docs-step,
        .docs-group {
          padding: var(--spacing-lg);
        }

        .docs-page__stats {
          grid-template-columns: 1fr;
        }

        .docs-step {
          grid-template-columns: 1fr;
        }

        .docs-step__number {
          width: 52px;
          height: 52px;
          border-radius: 16px;
        }

        .docs-group__header {
          flex-direction: column;
        }

        .docs-subagents {
          grid-template-columns: 1fr;
        }
      }

      /* App shell styles moved from src/styles/app-shell.css */

      body {
        background: #ffffff;
        background-image: none;
        color: #1a1a1a;
      }

      body::before {
        content: none;
      }

      .app-shell {
        --shell-bg: #ffffff;
        --shell-sidebar-bg: #f9f9f9;
        --shell-panel: #ffffff;
        --shell-panel-alt: #f4f4f4;
        --shell-hover: #f0f0f0;
        --shell-border: #e5e5e5;
        --shell-text: #1a1a1a;
        --shell-text-muted: #6b6b6b;
        --shell-text-soft: #b0b0b0;
        --shell-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
        min-height: 100vh;
        background: var(--shell-bg);
        color: var(--shell-text);
        font-family:
          "Söhne",
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }

      [data-theme="dark"] .app-shell {
        --shell-bg: #212121;
        --shell-sidebar-bg: #171717;
        --shell-panel: #212121;
        --shell-panel-alt: #2f2f2f;
        --shell-hover: #2a2a2a;
        --shell-border: #333333;
        --shell-text: #ececec;
        --shell-text-muted: #8e8e8e;
        --shell-text-soft: #555555;
        --shell-shadow: 0 10px 32px rgba(0, 0, 0, 0.22);
      }

      .app-shell__backdrop {
        position: fixed;
        inset: 0;
        z-index: 80;
        border: 0;
        padding: 0;
        background: rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(2px);
      }

      .app-shell .sidebar {
        position: relative;
        inset: auto;
        width: 256px;
        min-width: 256px;
        height: 100vh;
        border-right: 1px solid var(--shell-border);
        background: var(--shell-sidebar-bg);
        box-shadow: none;
        transform: none;
        border-radius: 0;
        overflow: hidden;
      }

      .app-shell .sidebar--collapsed {
        width: 88px;
        min-width: 88px;
      }

      .app-shell .sidebar__header {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 16px 12px 10px;
        min-height: auto;
        height: auto;
        border-bottom: 0;
        background: transparent;
      }

      .app-shell .sidebar__brand {
        flex: 1;
        min-width: 0;
      }

      .app-shell .sidebar__logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .app-shell .sidebar__logo-icon {
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: transparent;
        border: 1px solid var(--shell-border);
        color: var(--shell-text);
      }

      .app-shell .sidebar__logo-copy {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .app-shell .sidebar__logo-text {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--shell-text);
      }

      .app-shell .sidebar__logo-meta {
        font-size: 12px;
        color: var(--shell-text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .app-shell .sidebar__collapse,
      .app-shell .app__desktop-icon,
      .app-shell .app__menu-btn,
      .app-shell .app__mobile-cta,
      .app-shell .thread-head__action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--shell-border);
        border-radius: 10px;
        background: transparent;
        color: var(--shell-text-muted);
        cursor: pointer;
        transition:
          background 150ms ease,
          color 150ms ease,
          border-color 150ms ease;
      }

      .app-shell .sidebar__collapse:hover,
      .app-shell .app__desktop-icon:hover,
      .app-shell .app__menu-btn:hover,
      .app-shell .app__mobile-cta:hover,
      .app-shell .thread-head__action:hover {
        background: var(--shell-hover);
        color: var(--shell-text);
      }

      .app-shell .sidebar__nav {
        padding: 8px;
        gap: 4px;
      }

      .app-shell .sidebar__nav-label {
        padding: 0 8px 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--shell-text-soft);
      }

      .app-shell .sidebar__nav-item {
        justify-content: flex-start;
        gap: 10px;
        min-height: 44px;
        padding: 9px 10px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--shell-text-muted);
      }

      .app-shell .sidebar__nav-item:hover,
      .app-shell .sidebar__nav-item--active {
        background: var(--shell-hover);
        color: var(--shell-text);
      }

      .app-shell .sidebar__nav-item::after,
      .app-shell .sidebar__nav-item--active::after {
        content: none;
      }

      .app-shell .sidebar__nav-icon {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
      }

      .app-shell .sidebar__nav-copy {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 1px;
      }

      .app-shell .sidebar__nav-copy strong {
        font-size: 13.5px;
        font-weight: 500;
        line-height: 1.2;
      }

      .app-shell .sidebar__nav-copy small {
        font-size: 12px;
        color: var(--shell-text-muted);
      }

      .app-shell .sidebar__new-chat,
      .app-shell .sidebar__footer-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 40px;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--shell-text);
        font: inherit;
        font-size: 13.5px;
        cursor: pointer;
        text-align: left;
      }

      .app-shell .sidebar__new-chat:hover,
      .app-shell .sidebar__footer-item:hover {
        background: var(--shell-hover);
      }

      .app-shell .sidebar__footer {
        margin-top: auto;
        padding: 8px;
        border-top: 1px solid var(--shell-border);
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: transparent;
      }

      .app-shell .sidebar__footer-copy {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .app-shell .sidebar__footer-copy strong {
        font-size: 13.5px;
        font-weight: 500;
      }

      .app-shell .sidebar__footer-copy small {
        font-size: 12px;
        color: var(--shell-text-muted);
      }

      .app-shell .app__main {
        margin-left: 0;
        padding: 0;
        background: var(--shell-bg);
      }

      .app-shell .app__desktop-header,
      .app-shell .app__mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        background: var(--shell-panel);
        border-bottom: 1px solid var(--shell-border);
        box-shadow: none;
      }

      .app-shell .app__desktop-intro {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .app-shell .app__desktop-model {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        padding: 6px 12px;
        border: 1px solid var(--shell-border);
        border-radius: 12px;
        background: transparent;
        color: var(--shell-text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
      }

      .app-shell .app__desktop-copy {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--shell-text-muted);
      }

      .app-shell .app__desktop-actions,
      .app-shell .app__mobile-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .app-shell .app__main-frame {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: var(--shell-bg);
        box-shadow: none;
      }

      .app-shell .app__main-frame-inner {
        display: flex;
        flex: 1;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .app-shell .app__mobile-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .app-shell .app__mobile-brandmark {
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        border: 1px solid var(--shell-border);
        color: var(--shell-text);
      }

      .app-shell .app__mobile-titleblock {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .app-shell .app__title {
        font-size: 15px;
        font-weight: 600;
        color: var(--shell-text);
      }

      .app-shell .app__mobile-detail {
        font-size: 12px;
        color: var(--shell-text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .research-view {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        background: var(--shell-bg);
      }

      .research-view__scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 24px 0 176px;
      }

      .research-view__inner {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 0 24px;
      }

      .thread-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 24px;
      }

      .thread-head__copy {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }

      .thread-head__eyebrow,
      .land__helper,
      .la-kicker,
      .la-summary-label,
      .la-query,
      .la-process-meta,
      .composer__steering-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--shell-text-soft);
      }

      .thread-head__title,
      .land__h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--shell-text);
      }

      .thread-head__meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .thread-head__pill,
      .la-badge,
      .la-meta-pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid var(--shell-border);
        border-radius: 999px;
        background: transparent;
        color: var(--shell-text-muted);
        font-size: 12px;
        font-weight: 500;
      }

      .chat {
        overflow-y: auto;
      }

      .chat--thread {
        overflow: visible;
      }

      .chat__in {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .land {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
        gap: 20px;
      }

      .land__sub {
        max-width: 460px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--shell-text-muted);
      }

      .land__exs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
        max-width: 520px;
      }

      .land__ex {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 14px 16px;
        border: 1px solid var(--shell-border);
        border-radius: 12px;
        background: transparent;
        color: var(--shell-text-muted);
        text-align: left;
      }

      .land__ex:hover {
        background: var(--shell-hover);
        color: var(--shell-text);
      }

      .land__ex-label {

      .library-page__back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(255, 248, 238, 0.025);
        color: var(--ks-title);
        transition:
          border-color 180ms ease,
          background 180ms ease;
      }

      .library-page__back:hover {
        border-color: var(--ks-border-strong);
        background: rgba(156, 232, 199, 0.05);
      }

      .library-page__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .library-page__search-shell {
        display: grid;
        grid-template-columns: minmax(220px, 0.68fr) minmax(0, 1fr);
        gap: 16px;
        padding: 16px;
        margin-bottom: 18px;
        border-radius: 20px;
        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(8, 14, 18, 0.56);

        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;

        grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.9fr);
        gap: 14px;
        align-items: start;

        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(12, 18, 23, 0.74);

      .library-page__search-count,

      .search-filters__summary-body {
        color: var(--ks-text-dim);

      .library-page__search-input {

        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ks-title);
        font-size: 0.98rem;

        color: color-mix(in srgb, var(--ks-text-dim) 92%, white 8%);

      .library-page__search-clear {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;

        border-radius: 999px;
        background: rgba(255, 248, 238, 0.045);
        color: var(--ks-title);
        cursor: pointer;
      }

      .library-page__search-count {
        justify-self: end;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;

      .library-page__results-head {

        align-items: end;
        justify-content: space-between;
        gap: 18px;

        gap: 10px;

      .library-page__results-chip {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(156, 232, 199, 0.16);
        background: rgba(156, 232, 199, 0.08);
        color: var(--ks-title);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .search-filters {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .search-filters__summary {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(255, 248, 238, 0.022);

      .search-filters__summary-copy {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .search-filters__summary-body {

        font-size: 0.9rem;
        line-height: 1.6;

      .search-filters__active-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;

      .search-filters__pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid rgba(156, 232, 199, 0.14);
        border-radius: 999px;
        background: rgba(156, 232, 199, 0.05);
        color: var(--ks-title);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;

      .search-filters__bar {

      .search-filters__toggle {

        min-height: 52px;
        padding: 0 16px;
        border-radius: 16px;
        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(11, 18, 23, 0.78);
        color: var(--ks-title);
        cursor: pointer;
      }

      .search-filters__toggle--open {
        border-color: var(--ks-border-strong);
        background: rgba(156, 232, 199, 0.06);

      .search-filters__badge {
        display: inline-flex;

        justify-content: center;
        min-width: 22px;
        height: 22px;
        padding: 0 7px;

        background: rgba(156, 232, 199, 0.16);
        color: var(--ks-title);
        font-size: 0.72rem;
        font-weight: 800;
      }

      .search-filters__reset {
        justify-content: center;

      .search-filters__panel {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 16px;
        border-radius: 18px;
        border: 1px solid rgba(255, 248, 238, 0.06);
        background: var(--ks-panel-strong);
      }

      .search-filters__group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .search-filters__label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .search-filters__select {
        min-height: 46px;
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(255, 248, 238, 0.03);
        color: var(--ks-title);
        outline: none;
      }

      .search-filters__select:focus {
        border-color: var(--ks-border-strong);
        box-shadow: 0 0 0 3px rgba(156, 232, 199, 0.14);
      }

      .session-list {

        flex-direction: column;
        gap: 16px;

      .session-list__summary {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

        display: flex;
        flex-direction: column;
        gap: 8px;

        letter-spacing: 0.14em;

      .session-list__summary-title {
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(1.35rem, 2vw, 1.8rem);

        color: var(--ks-title);
      }

        margin: 0;
        color: var(--ks-text-dim);
        line-height: 1.7;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid rgba(156, 232, 199, 0.14);
        background: rgba(10, 16, 20, 0.62);
      }

      .session-list__selection-bar span,
      .bulk-actions__count {
        color: var(--ks-title);
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;

      .bulk-actions__note {
        display: block;
        font-size: 0.84rem;

      .bulk-actions__copy,
      .bulk-actions__buttons {
        display: flex;
        align-items: center;
        gap: 10px;

      .bulk-actions__copy {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;

      .bulk-actions__buttons {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .session-list__grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 18px;
      }

      .session-list--empty {

      .session-list__empty {
        display: grid;
        gap: 12px;
        justify-items: start;
        padding: 30px 24px;
        border-radius: 20px;
        border: 1px dashed rgba(255, 248, 238, 0.1);
        background: rgba(9, 15, 19, 0.48);

      .session-list__empty-grid {

        width: 100%;

      .session-list__empty-card {
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(255, 248, 238, 0.025);

        display: block;
        margin-bottom: 8px;
        color: var(--ks-text-dim);

        font-weight: 700;

        text-transform: uppercase;

        color: var(--ks-title);

      .session-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100%;
        padding: 18px;
        border-radius: 20px;
        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(9, 15, 19, 0.82);

        transition:
          border-color 180ms ease,
          box-shadow 180ms ease,
          background 180ms ease,
          opacity 180ms ease;

      .session-card:focus-visible {
        border-color: var(--ks-border-strong);

        outline: none;
      }

      .session-card--selected {
        border-color: rgba(156, 232, 199, 0.34);

          0 24px 48px rgba(0, 0, 0, 0.24);
      }

        opacity: 0.5;
        transform: scale(0.98);

      .session-card__checkbox {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 18px;
        height: 18px;
        accent-color: #78dfb8;

        gap: 10px;

        padding-right: 28px;

        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;

        border-radius: 999px;
        background: rgba(255, 248, 238, 0.05);
        color: var(--ks-text-dim);

        font-weight: 700;
        letter-spacing: 0.03em;

        line-height: 1.72;
        min-height: 5.1em;

        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;

        background: rgba(10, 16, 20, 0.9);

        text-decoration: none;
        transition:

          border-color 160ms ease;

        background: rgba(156, 232, 199, 0.07);

        background: rgba(255, 248, 238, 0.022);

        font-size: 1.2rem;

      .session-actions__form {
        padding: 10px;

        border: 1px solid rgba(255, 248, 238, 0.06);
        background: rgba(9, 15, 19, 0.94);

        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 14px;

        text-transform: uppercase;

        background: rgba(245, 139, 128, 0.14);
        color: #ffbeb7;

        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;

        gap: 12px;

        letter-spacing: 0.12em;
        text-transform: uppercase;

    <!-- PWA Registration -->
    <script>
      // Register service worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log(
                "[PWA] Service Worker registered:",
                registration.scope,
              );

              // Check for updates
              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                newWorker.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    // New content available
                    console.log("[PWA] New content available");
                    window.dispatchEvent(
                      new CustomEvent("pwa-update-available"),
                    );
                  }
                });
              });
            })
            .catch((error) => {
              console.error("[PWA] Service Worker registration failed:", error);
            });
        });
      }

      // Handle PWA install prompt
      let deferredPrompt;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.dispatchEvent(new CustomEvent("pwa-install-available"));
      });

      // Track install outcome
      window.addEventListener("appinstalled", () => {
        console.log("[PWA] App installed");
        deferredPrompt = null;
        // Track analytics event here
      });

      // Handle offline/online status
      window.addEventListener("offline", () => {
        window.dispatchEvent(new CustomEvent("app-offline"));
      });

      window.addEventListener("online", () => {
        window.dispatchEvent(new CustomEvent("app-online"));
      });
    </script>
