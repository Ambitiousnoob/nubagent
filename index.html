<html lang="en" data-theme="light">

      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"

    <meta name="msapplication-TileColor" content="#00c9a7" />

    <!-- PWA Manifest -->

    <link

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <title>NubAgent Docs - API and Runtime Reference</title>
    <style id="app-global-styles">
      /**
 * NubAgent Styles
 * Modern CSS with variables, theming, and responsive design
 */

      /* ============================================
   CSS Custom Properties (Variables)
   ============================================ */
      :root {
        /* Colors - Dark Theme (Default) */
        --color-bg-primary: #0a0a0f;
        --color-bg-secondary: #12121a;
        --color-bg-tertiary: #1a1a25;
        --color-bg-elevated: #222230;

        --color-text-primary: #ffffff;
        --color-text-secondary: #a0a0b0;
        --color-text-tertiary: #6a6a7a;
        --color-text-muted: #4a4a5a;

        --color-border: #2a2a3a;
        --color-border-light: #3a3a4a;

        --color-accent: #00c9a7;
        --color-accent-hover: #00e0b8;
        --color-accent-light: rgba(0, 201, 167, 0.1);
        --color-accent-dark: rgba(0, 201, 167, 0.2);

        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-error: #ef4444;
        --color-info: #3b82f6;

        /* Spacing */
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 24px;
        --spacing-xl: 32px;
        --spacing-2xl: 48px;

        /* Border Radius */
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-full: 9999px;

        /* Shadows */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
        --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.6);

        /* Transitions */
        --transition-fast: 150ms ease;
        --transition-base: 250ms ease;
        --transition-slow: 400ms ease;

        /* Typography */
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        --font-mono:
          "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;

        /* Layout */
        --sidebar-width: 260px;
        --sidebar-width-collapsed: 72px;
        --header-height: 56px;
      }

      /* Light Theme */
      [data-theme="light"] {
        --color-bg-primary: #ffffff;
        --color-bg-secondary: #f5f5f7;
        --color-bg-tertiary: #e8e8ed;
        --color-bg-elevated: #ffffff;

        --color-text-primary: #1a1a2e;
        --color-text-secondary: #4a4a5a;
        --color-text-tertiary: #6a6a7a;
        --color-text-muted: #9a9aaa;

        --color-border: #e0e0e8;
        --color-border-light: #d0d0d8;

        --color-accent: #00a889;
        --color-accent-hover: #00c9a7;
        --color-accent-light: rgba(0, 168, 137, 0.1);
        --color-accent-dark: rgba(0, 168, 137, 0.2);

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
        --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.16);
      }

      /* ============================================
   Base Styles
   ============================================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        color: var(--color-text-primary);
        background-color: var(--color-bg-primary);
        background-image: url("https://images.pexels.com/photos/7130558/pexels-photo-7130558.jpeg?auto=compress&cs=tinysrgb&dpr=2&w=1920");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: var(--color-bg-primary);
        opacity: 0.92;
        z-index: -1;
      }

      #root {
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      /* ============================================
   App Layout
   ============================================ */
      .app {
        display: flex;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      .app__main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin-left: var(--sidebar-width);
        transition: margin-left var(--transition-base);
      }

      .app__mobile-header {
        display: none;
        align-items: center;
        justify-content: space-between;
        height: var(--header-height);
        padding: 0 var(--spacing-md);
        background: var(--color-bg-secondary);
        border-bottom: 1px solid var(--color-border);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
      }

      .app__menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: none;
        background: transparent;
        color: var(--color-text-primary);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background var(--transition-fast);
      }

      .app__menu-btn:hover {
        background: var(--color-bg-tertiary);
      }

      .app__title {
        font-size: 18px;
        font-weight: 600;
        color: var(--color-text-primary);
      }

      .app__mobile-spacer {
        width: 40px;
      }

      /* ============================================
   Sidebar
   ============================================ */
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--sidebar-width);
        background: var(--color-bg-secondary);
        border-right: 1px solid var(--color-border);
        display: flex;
        flex-direction: column;
        z-index: 50;
        transition:
          transform var(--transition-base),
          width var(--transition-base);
      }

      .sidebar--closed {
        transform: translateX(-100%);
      }

      .sidebar--collapsed {
        width: var(--sidebar-width-collapsed);
      }

      .sidebar__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-md);
        border-bottom: 1px solid var(--color-border);
        height: var(--header-height);
      }

      .sidebar__logo {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
      }

      .sidebar__logo-icon {
        font-size: 24px;
      }

      .sidebar__logo-text {
        font-size: 18px;
        font-weight: 700;
        color: var(--color-text-primary);
        letter-spacing: -0.5px;
      }

      .sidebar__collapse {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: none;
        background: var(--color-bg-tertiary);
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .sidebar__collapse:hover {
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
      }

      .sidebar__nav {
        flex: 1;
        padding: var(--spacing-md);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      .sidebar__nav-item {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        padding: var(--spacing-sm) var(--spacing-md);
        border: none;
        background: transparent;
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all var(--transition-fast);
        text-align: left;
      }

      .sidebar__nav-item:hover {
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
      }

      .sidebar__nav-item--active {
        background: var(--color-accent-light);
        color: var(--color-accent);
      }

      .sidebar__actions {
        padding: var(--spacing-md);
        border-top: 1px solid var(--color-border);
      }

      .sidebar__new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        width: 100%;
        padding: var(--spacing-sm) var(--spacing-md);
        border: 1px dashed var(--color-border-light);
        background: transparent;
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all var(--transition-fast);
      }

      .sidebar__new-chat:hover {
        border-color: var(--color-accent);
        color: var(--color-accent);
        background: var(--color-accent-light);
      }

      .sidebar__footer {
        padding: var(--spacing-md);
        border-top: 1px solid var(--color-border);
      }

      .sidebar__footer-item {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        width: 100%;
        padding: var(--spacing-sm) var(--spacing-md);
        border: none;
        background: transparent;
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 14px;
        transition: all var(--transition-fast);
        text-align: left;
      }

      .sidebar__footer-item:hover {
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
      }

      /* ============================================
   Button Components
   ============================================ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm) var(--spacing-md);
        border: none;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all var(--transition-fast);
        white-space: nowrap;
      }

      .btn--primary {
        background: var(--color-accent);
        color: #000;
      }

      .btn--primary:hover:not(.btn--disabled) {
        background: var(--color-accent-hover);
      }

      .btn--secondary {
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
      }

      .btn--secondary:hover:not(.btn--disabled) {
        background: var(--color-bg-elevated);
      }

      .btn--outline {
        background: transparent;
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
      }

      .btn--outline:hover:not(.btn--disabled) {
        border-color: var(--color-accent);
        color: var(--color-accent);
      }

      .btn--ghost {
        background: transparent;
        color: var(--color-text-secondary);
      }

      .btn--ghost:hover:not(.btn--disabled) {
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
      }

      .btn--danger {
        background: var(--color-error);
        color: #fff;
      }

      .btn--danger:hover:not(.btn--disabled) {
        opacity: 0.9;
      }

      .btn--sm {
        padding: var(--spacing-xs) var(--spacing-sm);
        font-size: 13px;
      }

      .btn--md {
        padding: var(--spacing-sm) var(--spacing-md);
        font-size: 14px;
      }

      .btn--lg {
        padding: var(--spacing-md) var(--spacing-lg);
        font-size: 16px;
      }

      .btn--loading {
        pointer-events: none;
      }

      .btn--disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn__spinner {
        animation: spin 1s linear infinite;
      }

      .btn__content {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ============================================
   Input Components
   ============================================ */
      .input-wrapper {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      .input__label {
        font-size: 13px;
        font-weight: 500;
        color: var(--color-text-secondary);
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
      }

      .input__required {
        color: var(--color-error);
      }

      .input__container {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input {
        width: 100%;
        padding: var(--spacing-sm) var(--spacing-md);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
        font-size: 14px;
        font-family: inherit;
        transition: all var(--transition-fast);
      }

      .input:focus {
        outline: none;
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px var(--color-accent-light);
      }

      .input::placeholder {
        color: var(--color-text-muted);
      }

      .input--with-icon {
        padding-left: 40px;
      }

      .input__icon {
        position: absolute;
        left: var(--spacing-md);
        color: var(--color-text-muted);
        pointer-events: none;
      }

      .input__status {
        position: absolute;
        right: var(--spacing-md);
        display: flex;
        align-items: center;
      }

      .input__status--error {
        color: var(--color-error);
      }

      .input__status--success {
        color: var(--color-success);
      }

      .input__message {
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .input__message--error {
        color: var(--color-error);
      }

      .input__message--success {
        color: var(--color-success);
      }

      .input--error {
        border-color: var(--color-error);
      }

      .input--error:focus {
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
      }

      .input--success {
        border-color: var(--color-success);
      }

      .input--success:focus {
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
      }

      .input--textarea {
        resize: vertical;
        min-height: 100px;
      }

      /* ============================================
   Modal Components
   ============================================ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: var(--spacing-md);
        backdrop-filter: blur(4px);
      }

      .modal {
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        max-width: 100%;
        max-height: 90vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-xl);
      }

      .modal--sm {
        width: 100%;
        max-width: 400px;
      }
      .modal--md {
        width: 100%;
        max-width: 560px;
      }
      .modal--lg {
        width: 100%;
        max-width: 720px;
      }
      .modal--xl {
        width: 100%;
        max-width: 960px;
      }

      .modal__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-md) var(--spacing-lg);
        border-bottom: 1px solid var(--color-border);
      }

      .modal__title {
        font-size: 18px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0;
      }

      .modal__close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .modal__close:hover {
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
      }

      .modal__content {
        flex: 1;
        overflow-y: auto;
        padding: var(--spacing-lg);
      }

      .modal__footer {
        padding: var(--spacing-md) var(--spacing-lg);
        border-top: 1px solid var(--color-border);
        display: flex;
        justify-content: flex-end;
        gap: var(--spacing-sm);
      }

      /* ============================================
   Skeleton Components
   ============================================ */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--color-bg-tertiary) 25%,
          var(--color-bg-elevated) 50%,
          var(--color-bg-tertiary) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: var(--radius-md);
      }

      .skeleton--text {
        height: 16px;
      }

      .skeleton--circle {
        border-radius: 50%;
      }

      .skeleton--rect {
        border-radius: var(--radius-md);
      }

      .skeleton--lines {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
      }

      .skeleton__line {
        height: 16px;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .skeleton-card {
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }

      .skeleton-card__content {
        padding: var(--spacing-md);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
      }

      .skeleton-list__item {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        padding: var(--spacing-md);
        border-bottom: 1px solid var(--color-border);
      }

      .skeleton-list__content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      /* ============================================
   Error Boundary
   ============================================ */
      .error-boundary {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--spacing-2xl);
        text-align: center;
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        max-width: 500px;
        margin: var(--spacing-xl) auto;
      }

      .error-boundary__icon {
        color: var(--color-warning);
        margin-bottom: var(--spacing-md);
      }

      .error-boundary__title {
        font-size: 20px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-sm);
      }

      .error-boundary__message {
        color: var(--color-text-secondary);
        margin: 0 0 var(--spacing-lg);
      }

      .error-boundary__details {
        width: 100%;
        text-align: left;
        margin-bottom: var(--spacing-lg);
      }

      .error-boundary__stack {
        background: var(--color-bg-tertiary);
        padding: var(--spacing-md);
        border-radius: var(--radius-md);
        font-size: 12px;
        color: var(--color-text-secondary);
        overflow-x: auto;
        max-height: 200px;
      }

      .error-boundary__actions {
        display: flex;
        gap: var(--spacing-sm);
      }

      /* ============================================
   Chat Components
   ============================================ */
      .chat-history {
        flex: 1;
        overflow-y: auto;
        padding: var(--spacing-lg);
        display: flex;
        flex-direction: column;
      }

      .chat-history--empty {
        align-items: center;
        justify-content: center;
      }

      .chat-history__empty {
        text-align: center;
        padding: var(--spacing-2xl);
      }

      .chat-history__empty-icon {
        font-size: 48px;
        margin-bottom: var(--spacing-md);
        opacity: 0.5;
      }

      .chat-history__empty-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-sm);
      }

      .chat-history__empty-text {
        color: var(--color-text-secondary);
        margin: 0;
      }

      .chat-history__content {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }

      .chat-history__loading {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-lg);
        color: var(--color-text-secondary);
      }

      .chat-history__loading-dots {
        display: flex;
        gap: var(--spacing-xs);
      }

      .chat-history__loading-dot {
        width: 8px;
        height: 8px;
        background: var(--color-accent);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
      }

      .chat-history__loading-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .chat-history__loading-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      .chat-history__scroll-bottom {
        position: fixed;
        bottom: 100px;
        right: 24px;
        width: 40px;
        height: 40px;
        border: none;
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: var(--shadow-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: all var(--transition-fast);
        z-index: 10;
      }

      .chat-history__scroll-bottom:hover {
        background: var(--color-accent);
        color: #000;
      }

      /* Chat Message */
      .chat-message {
        display: flex;
        gap: var(--spacing-md);
        padding: var(--spacing-md);
        border-radius: var(--radius-lg);
      }

      .chat-message--user {
        background: var(--color-accent-light);
      }

      .chat-message--assistant {
        background: var(--color-bg-tertiary);
      }

      .chat-message__avatar {
        flex-shrink: 0;
      }

      .chat-message__avatar--user,
      .chat-message__avatar--assistant {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
      }

      .chat-message__avatar--user {
        background: var(--color-accent);
        color: #000;
      }

      .chat-message__avatar--assistant {
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
      }

      .chat-message__content {
        flex: 1;
        min-width: 0;
      }

      .chat-message__header {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-sm);
      }

      .chat-message__role {
        font-size: 13px;
        font-weight: 600;
        color: var(--color-text-primary);
      }

      .chat-message__time {
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .chat-message__body {
        color: var(--color-text-secondary);
        line-height: 1.6;
      }

      .chat-message__markdown {
        word-wrap: break-word;
      }

      .chat-message__markdown h1,
      .chat-message__markdown h2,
      .chat-message__markdown h3 {
        color: var(--color-text-primary);
        margin-top: var(--spacing-md);
        margin-bottom: var(--spacing-sm);
      }

      .chat-message__markdown p {
        margin: var(--spacing-sm) 0;
      }

      .chat-message__markdown ul,
      .chat-message__markdown ol {
        margin: var(--spacing-sm) 0;
        padding-left: var(--spacing-lg);
      }

      .chat-message__markdown a {
        color: var(--color-accent);
        text-decoration: none;
      }

      .chat-message__markdown a:hover {
        text-decoration: underline;
      }

      .chat-message__markdown code {
        background: var(--color-bg-elevated);
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 13px;
      }

      .chat-message__markdown pre {
        background: var(--color-bg-elevated);
        border-radius: var(--radius-md);
        padding: var(--spacing-md);
        overflow-x: auto;
        margin: var(--spacing-md) 0;
      }

      .chat-message__code-block {
        position: relative;
        margin: var(--spacing-md) 0;
      }

      .chat-message__code-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-xs) var(--spacing-sm);
        background: var(--color-bg-elevated);
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .chat-message__code-copy {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: var(--color-text-muted);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .chat-message__code-copy:hover {
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
      }

      .chat-message__cursor {
        display: inline-block;
        animation: blink 1s infinite;
        color: var(--color-accent);
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }

      .chat-message__attachments {
        display: flex;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-md);
        flex-wrap: wrap;
      }

      .chat-message__attachment {
        position: relative;
      }

      .chat-message__attachment-img {
        max-width: 200px;
        max-height: 150px;
        border-radius: var(--radius-md);
        object-fit: cover;
      }

      .chat-message__attachment-file {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--color-bg-elevated);
        border-radius: var(--radius-md);
        font-size: 13px;
        color: var(--color-text-secondary);
      }

      /* Chat Input */
      .chat-input {
        border-top: 1px solid var(--color-border);
        background: var(--color-bg-secondary);
        padding: var(--spacing-md);
      }

      .chat-input--focused {
        border-color: var(--color-accent);
      }

      .chat-input--disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .chat-input__attachments {
        display: flex;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-md);
        flex-wrap: wrap;
      }

      .chat-input__attachment {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .chat-input__attachment-preview {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: var(--radius-md);
        border: 1px solid var(--color-border);
      }

      .chat-input__attachment-file {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--color-bg-tertiary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        font-size: 12px;
        color: var(--color-text-secondary);
      }

      .chat-input__attachment-remove {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 20px;
        height: 20px;
        border: none;
        background: var(--color-error);
        color: #fff;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
      }

      .chat-input__attachment-remove:hover {
        transform: scale(1.1);
      }

      .chat-input__container {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
      }

      .chat-input__textarea {
        width: 100%;
        min-height: 60px;
        max-height: 200px;
        padding: var(--spacing-md);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
        font-size: 14px;
        font-family: inherit;
        resize: none;
        transition: all var(--transition-fast);
      }

      .chat-input__textarea:focus {
        outline: none;
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px var(--color-accent-light);
      }

      .chat-input__textarea::placeholder {
        color: var(--color-text-muted);
      }

      .chat-input__actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .chat-input__chars {
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .chat-input__chars-count--warning {
        color: var(--color-warning);
      }

      .chat-input__chars-count--error {
        color: var(--color-error);
      }

      .chat-input__send {
        min-width: 40px;
      }

      .chat-input__toolbar {
        display: flex;
        gap: var(--spacing-sm);
        margin-top: var(--spacing-sm);
      }

      .chat-input__toolbar-btn {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
        padding: var(--spacing-xs) var(--spacing-sm);
        border: none;
        background: transparent;
        color: var(--color-text-muted);
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 12px;
        transition: all var(--transition-fast);
      }

      .chat-input__toolbar-btn:hover {
        color: var(--color-text-primary);
        background: var(--color-bg-tertiary);
      }

      .chat-input__file-input {
        display: none;
      }

      /* Typing Indicator */
      .typing-indicator {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-md);
        color: var(--color-text-secondary);
      }

      .typing-indicator__dots {
        display: flex;
        gap: var(--spacing-xs);
      }

      .typing-indicator__dot {
        width: 6px;
        height: 6px;
        background: var(--color-accent);
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-indicator__dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-indicator__dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      .typing-indicator__text {
        font-size: 13px;
      }

      .typing-indicator__dots-text {
        animation: blink 1s infinite;
      }

      /* Streaming Progress */
      .streaming-progress {
        padding: var(--spacing-md);
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-md);
      }

      .streaming-progress__header {
        display: flex;
        justify-content: space-between;
        margin-bottom: var(--spacing-sm);
        font-size: 13px;
        color: var(--color-text-secondary);
      }

      .streaming-progress__bar {
        height: 4px;
        background: var(--color-bg-elevated);
        border-radius: var(--radius-full);
        overflow: hidden;
      }

      .streaming-progress__fill {
        height: 100%;
        background: var(--color-accent);
        border-radius: var(--radius-full);
        transition: width var(--transition-base);
      }

      /* ============================================
   Search Components
   ============================================ */
      .search-results {
        margin: var(--spacing-lg) 0;
      }

      .search-results__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--spacing-md);
      }

      .search-results__title {
        font-size: 16px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0;
      }

      .search-results__count {
        font-size: 13px;
        color: var(--color-text-muted);
      }

      .search-results__grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: var(--spacing-md);
      }

      /* Search Result Card */
      .search-result-card {
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--spacing-md);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .search-result-card:hover {
        border-color: var(--color-accent);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .search-result-card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--spacing-sm);
      }

      .search-result-card__source {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
      }

      .search-result-card__favicon {
        width: 16px;
        height: 16px;
        border-radius: var(--radius-sm);
      }

      .search-result-card__domain {
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .search-result-card__category {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        text-transform: uppercase;
        font-weight: 600;
      }

      .badge--official {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
      }
      .badge--research {
        background: rgba(139, 92, 246, 0.2);
        color: #8b5cf6;
      }
      .badge--news {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }
      .badge--vendor {
        background: rgba(16, 185, 129, 0.2);
        color: #10b981;
      }
      .badge--web {
        background: rgba(107, 114, 128, 0.2);
        color: #6b7280;
      }

      .search-result-card__external {
        color: var(--color-text-muted);
        transition: color var(--transition-fast);
      }

      .search-result-card__external:hover {
        color: var(--color-accent);
      }

      .search-result-card__title {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-sm);
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
      }

      .search-result-card__index {
        font-size: 12px;
        color: var(--color-text-muted);
        font-weight: 400;
      }

      .search-result-card__description {
        font-size: 13px;
        color: var(--color-text-secondary);
        line-height: 1.5;
        margin: 0 0 var(--spacing-sm);
      }

      .search-result-card__footer {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .search-result-card__date {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
      }

      .search-result-card__tags {
        display: flex;
        gap: var(--spacing-xs);
      }

      .search-result-card__tag {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px 6px;
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-sm);
      }

      /* Search Filters */
      .search-filters {
        margin-bottom: var(--spacing-md);
      }

      .search-filters__bar {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
      }

      .search-filters__toggle {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
        padding: var(--spacing-xs) var(--spacing-sm);
        border: 1px solid var(--color-border);
        background: var(--color-bg-tertiary);
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 13px;
        transition: all var(--transition-fast);
      }

      .search-filters__toggle:hover {
        border-color: var(--color-accent);
        color: var(--color-accent);
      }

      .search-filters__badge {
        width: 6px;
        height: 6px;
        background: var(--color-accent);
        border-radius: 50%;
      }

      .search-filters__reset {
        font-size: 12px;
      }

      .search-filters__panel {
        display: flex;
        gap: var(--spacing-md);
        padding: var(--spacing-md);
        margin-top: var(--spacing-sm);
        background: var(--color-bg-tertiary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        flex-wrap: wrap;
      }

      .search-filters__group {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      .search-filters__label {
        font-size: 12px;
        font-weight: 500;
        color: var(--color-text-muted);
      }

      .search-filters__select {
        padding: var(--spacing-xs) var(--spacing-sm);
        border: 1px solid var(--color-border);
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
        border-radius: var(--radius-sm);
        font-size: 13px;
        cursor: pointer;
      }

      /* ============================================
   Library Components
   ============================================ */
      .library-page {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: var(--spacing-lg);
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }

      .library-page__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--spacing-lg);
      }

      .library-page__title-section {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
      }

      .library-page__back {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: none;
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .library-page__back:hover {
        background: var(--color-bg-elevated);
      }

      .library-page__title {
        font-size: 24px;
        font-weight: 700;
        color: var(--color-text-primary);
        margin: 0;
      }

      .library-page__actions {
        display: flex;
        gap: var(--spacing-sm);
      }

      .library-page__search-section {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
        margin-bottom: var(--spacing-lg);
      }

      .library-page__search {
        position: relative;
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
      }

      .library-page__search-icon {
        color: var(--color-text-muted);
        flex-shrink: 0;
      }

      .library-page__search-input {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--color-text-primary);
        font-size: 14px;
        font-family: inherit;
      }

      .library-page__search-input:focus {
        outline: none;
      }

      .library-page__search-input::placeholder {
        color: var(--color-text-muted);
      }

      .library-page__search-clear {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border: none;
        background: transparent;
        color: var(--color-text-muted);
        cursor: pointer;
        font-size: 18px;
      }

      .library-page__search-clear:hover {
        color: var(--color-text-primary);
      }

      .library-page__search-count {
        font-size: 12px;
        color: var(--color-text-muted);
        white-space: nowrap;
      }

      /* Session List */
      .session-list {
        flex: 1;
        overflow-y: auto;
      }

      .session-list--loading {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: var(--spacing-md);
      }

      .session-list--empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 300px;
      }

      .session-list__empty {
        text-align: center;
        padding: var(--spacing-2xl);
      }

      .session-list__empty-icon {
        font-size: 48px;
        margin-bottom: var(--spacing-md);
        opacity: 0.5;
      }

      .session-list__empty-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-sm);
      }

      .session-list__empty-text {
        color: var(--color-text-secondary);
        margin: 0 0 var(--spacing-lg);
      }

      .session-list__grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: var(--spacing-md);
      }

      .session-list__selection-bar {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--color-accent-light);
        border: 1px solid var(--color-accent);
        border-radius: var(--radius-md);
        margin-bottom: var(--spacing-md);
        font-size: 13px;
        color: var(--color-accent);
      }

      /* Session Card */
      .session-card {
        position: relative;
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--spacing-md);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .session-card:hover {
        border-color: var(--color-accent);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .session-card--deleting {
        opacity: 0;
        transform: scale(0.95);
      }

      .session-card--selected {
        border-color: var(--color-accent);
        background: var(--color-accent-light);
      }

      .session-card__checkbox {
        position: absolute;
        top: var(--spacing-md);
        left: var(--spacing-md);
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      .session-card__header {
        display: flex;
        justify-content: flex-end;
        margin-bottom: var(--spacing-sm);
      }

      .session-card__meta {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        font-size: 11px;
        color: var(--color-text-muted);
      }

      .session-card__date,
      .session-card__sources,
      .session-card__attachments {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .session-card__query {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-sm);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .session-card__preview {
        font-size: 12px;
        color: var(--color-text-secondary);
        line-height: 1.5;
        margin: 0 0 var(--spacing-md);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .session-card__source {
        display: flex;
        align-items: center;
        gap: var(--spacing-xs);
        padding: var(--spacing-xs) var(--spacing-sm);
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-sm);
        margin-bottom: var(--spacing-md);
      }

      .session-card__favicon {
        width: 14px;
        height: 14px;
        border-radius: var(--radius-xs);
      }

      .session-card__domain {
        font-size: 11px;
        color: var(--color-text-muted);
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-card__actions {
        display: flex;
        gap: var(--spacing-xs);
        opacity: 0;
        transition: opacity var(--transition-fast);
      }

      .session-card__actions--visible {
        opacity: 1;
      }

      .session-card__action {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: none;
        background: var(--color-bg-tertiary);
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .session-card__action:hover {
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
      }

      .session-card__action--delete:hover {
        background: rgba(239, 68, 68, 0.1);
        color: var(--color-error);
      }

      /* Bulk Actions */
      .bulk-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--color-bg-tertiary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        margin-bottom: var(--spacing-md);
      }

      .bulk-actions__count {
        font-size: 13px;
        color: var(--color-text-secondary);
      }

      .bulk-actions__buttons {
        display: flex;
        gap: var(--spacing-sm);
      }

      /* Session Actions Modal */
      .session-actions__menu {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      .session-actions__form {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .session-actions__field {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      .session-actions__label {
        font-size: 12px;
        font-weight: 600;
        color: var(--color-text-secondary);
      }

      .session-actions__input,
      .session-actions__textarea {
        width: 100%;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-bg-secondary);
        color: var(--color-text-primary);
        padding: 12px 14px;
        font: inherit;
      }

      .session-actions__input:focus,
      .session-actions__textarea:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
      }

      .session-actions__textarea {
        resize: vertical;
        min-height: 180px;
        line-height: 1.5;
      }

      .session-actions__form-buttons {
        display: flex;
        justify-content: flex-end;
        gap: var(--spacing-sm);
      }

      .session-actions__item {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        width: 100%;
        padding: var(--spacing-sm) var(--spacing-md);
        border: none;
        background: transparent;
        color: var(--color-text-primary);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 14px;
        text-align: left;
        transition: all var(--transition-fast);
      }

      .session-actions__item:hover {
        background: var(--color-bg-tertiary);
      }

      .session-actions__item--nested {
        padding-left: var(--spacing-xl);
      }

      .session-actions__item--danger {
        color: var(--color-error);
      }

      .session-actions__item--danger:hover {
        background: rgba(239, 68, 68, 0.1);
      }

      .session-actions__divider {
        height: 1px;
        background: var(--color-border);
        margin: var(--spacing-xs) 0;
      }

      .session-actions__submenu {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      .session-actions__submenu-label {
        font-size: 11px;
        color: var(--color-text-muted);
        text-transform: uppercase;
        padding: var(--spacing-xs) var(--spacing-md);
        letter-spacing: 0.05em;
      }

      .session-actions__confirm {
        text-align: center;
      }

      .session-actions__confirm-icon {
        font-size: 32px;
        margin-bottom: var(--spacing-md);
      }

      .session-actions__confirm-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-sm);
      }

      .session-actions__confirm-text {
        font-size: 13px;
        color: var(--color-text-secondary);
        margin: 0 0 var(--spacing-md);
        word-break: break-word;
      }

      .session-actions__confirm-sub {
        font-size: 12px;
        color: var(--color-error);
        margin: 0 0 var(--spacing-lg);
      }

      .session-actions__confirm-buttons {
        display: flex;
        gap: var(--spacing-sm);
        justify-content: center;
      }

      /* ============================================
   Settings Components
   ============================================ */
      .settings-modal__layout {
        display: flex;
        min-height: 400px;
      }

      .settings-modal__tabs {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
        padding: var(--spacing-md);
        border-right: 1px solid var(--color-border);
        min-width: 180px;
      }

      .settings-modal__tab {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm) var(--spacing-md);
        border: none;
        background: transparent;
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 14px;
        text-align: left;
        transition: all var(--transition-fast);
      }

      .settings-modal__tab:hover {
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
      }

      .settings-modal__tab--active {
        background: var(--color-accent-light);
        color: var(--color-accent);
      }

      .settings-modal__content {
        flex: 1;
        overflow-y: auto;
      }

      .settings-tab {
        padding: var(--spacing-md);
      }

      .settings-section {
        margin-bottom: var(--spacing-lg);
      }

      .settings-section__title {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-md);
      }

      .settings-section__description {
        font-size: 13px;
        color: var(--color-text-secondary);
        margin: 0 0 var(--spacing-md);
      }

      .settings-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-sm) 0;
      }

      .settings-item__label {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        font-size: 14px;
        color: var(--color-text-primary);
      }

      .settings-toggle {
        width: 44px;
        height: 24px;
        border: none;
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-full);
        cursor: pointer;
        position: relative;
        appearance: none;
        transition: background var(--transition-fast);
      }

      .settings-toggle:checked {
        background: var(--color-accent);
      }

      .settings-toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        transition: transform var(--transition-fast);
      }

      .settings-toggle:checked::after {
        transform: translateX(20px);
      }

      /* API Key Form */
      .api-key-form {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .api-key-form__header {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        color: var(--color-text-primary);
      }

      .api-key-form__title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }

      .api-key-form__description {
        font-size: 13px;
        color: var(--color-text-secondary);
        margin: 0;
      }

      .api-key-form__provider {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      .api-key-form__label {
        font-size: 13px;
        font-weight: 500;
        color: var(--color-text-secondary);
      }

      .api-key-form__select {
        padding: var(--spacing-sm) var(--spacing-md);
        border: 1px solid var(--color-border);
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
        border-radius: var(--radius-md);
        font-size: 14px;
        cursor: pointer;
      }

      .api-key-form__existing,
      .api-key-form__new {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .api-key-form__key-display {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-md);
        background: var(--color-bg-tertiary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
      }

      .api-key-form__key-masked {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--color-text-secondary);
      }

      .api-key-form__key-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        color: var(--color-text-muted);
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: all var(--transition-fast);
      }

      .api-key-form__key-toggle:hover {
        color: var(--color-text-primary);
        background: var(--color-bg-elevated);
      }

      .api-key-form__key-visible {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--color-text-secondary);
        word-break: break-all;
        padding: var(--spacing-sm);
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-md);
      }

      .api-key-form__actions {
        display: flex;
        gap: var(--spacing-sm);
      }

      .api-key-form__info {
        margin-top: var(--spacing-md);
        padding: var(--spacing-md);
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-md);
      }

      .api-key-form__info h4 {
        font-size: 13px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-sm);
      }

      .api-key-form__info ul {
        margin: 0;
        padding-left: var(--spacing-md);
        font-size: 12px;
        color: var(--color-text-secondary);
      }

      .api-key-form__info li {
        margin-bottom: var(--spacing-xs);
      }

      .api-key-form__info a {
        color: var(--color-accent);
        text-decoration: none;
      }

      .api-key-form__info a:hover {
        text-decoration: underline;
      }

      /* Theme Toggle */
      .theme-toggle {
        display: flex;
        gap: var(--spacing-sm);
      }

      .theme-toggle__option {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-xs);
        padding: var(--spacing-md);
        border: 1px solid var(--color-border);
        background: var(--color-bg-tertiary);
        color: var(--color-text-secondary);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 12px;
        transition: all var(--transition-fast);
        min-width: 80px;
      }

      .theme-toggle__option:hover {
        border-color: var(--color-accent);
        color: var(--color-accent);
      }

      .theme-toggle__option--active {
        border-color: var(--color-accent);
        background: var(--color-accent-light);
        color: var(--color-accent);
      }

      .theme-toggle__system-icon {
        font-size: 20px;
      }

      /* Model Selector */
      .model-selector {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .model-selector__header {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        color: var(--color-text-primary);
      }

      .model-selector__title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }

      .model-selector__description {
        font-size: 13px;
        color: var(--color-text-secondary);
        margin: 0;
      }

      .model-selector__grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: var(--spacing-md);
      }

      .model-selector__card {
        position: relative;
        padding: var(--spacing-md);
        border: 1px solid var(--color-border);
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-lg);
        cursor: pointer;
        text-align: left;
        transition: all var(--transition-fast);
      }

      .model-selector__card:hover {
        border-color: var(--color-accent);
      }

      .model-selector__card--selected {
        border-color: var(--color-accent);
        background: var(--color-accent-light);
      }

      .model-selector__card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--spacing-sm);
      }

      .model-selector__card-icon {
        color: var(--color-accent);
      }

      .model-selector__badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        text-transform: uppercase;
        font-weight: 600;
      }

      .model-selector__badge--recommended {
        background: var(--color-accent);
        color: #000;
      }

      .model-selector__badge--premium {
        background: rgba(139, 92, 246, 0.2);
        color: #8b5cf6;
      }

      .model-selector__card-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-xs);
      }

      .model-selector__card-description {
        font-size: 12px;
        color: var(--color-text-secondary);
        margin: 0;
      }

      .model-selector__card-check {
        position: absolute;
        top: var(--spacing-md);
        right: var(--spacing-md);
        width: 20px;
        height: 20px;
        background: var(--color-accent);
        color: #000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }

      .model-selector__info {
        margin-top: var(--spacing-md);
        padding: var(--spacing-md);
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-md);
      }

      .model-selector__info h4 {
        font-size: 13px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0 0 var(--spacing-sm);
      }

      .model-selector__info ul {
        margin: 0;
        padding-left: var(--spacing-md);
        font-size: 12px;
        color: var(--color-text-secondary);
      }

      .model-selector__info li {
        margin-bottom: var(--spacing-xs);
      }

      .settings-clear-confirm {
        text-align: center;
      }

      .settings-clear-confirm p {
        font-size: 14px;
        color: var(--color-text-secondary);
        margin: 0 0 var(--spacing-lg);
      }

      .settings-clear-confirm__actions {
        display: flex;
        gap: var(--spacing-sm);
        justify-content: center;
      }

      /* ============================================
   Toast Notifications (Sonner overrides)
   ============================================ */
      :root {
        --toast-bg: var(--color-bg-elevated);
        --toast-border: var(--color-border);
        --toast-text: var(--color-text-primary);
        --toast-success: var(--color-success);
        --toast-error: var(--color-error);
        --toast-warning: var(--color-warning);
        --toast-info: var(--color-info);
      }

      .toast {
        background: var(--toast-bg) !important;
        border: 1px solid var(--toast-border) !important;
        color: var(--toast-text) !important;
        box-shadow: var(--shadow-lg) !important;
      }

      .toast--success {
        border-left: 3px solid var(--toast-success) !important;
      }

      .toast--error {
        border-left: 3px solid var(--toast-error) !important;
      }

      .toast--warning {
        border-left: 3px solid var(--toast-warning) !important;
      }

      .toast--info {
        border-left: 3px solid var(--toast-info) !important;
      }

      .toast__spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--color-border);
        border-top-color: var(--color-accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* ============================================
   Responsive Design
   ============================================ */
      @media (max-width: 1024px) {
        :root {
          --sidebar-width: 240px;
        }

        /* Auto-collapse sidebar on medium screens */
        .sidebar {
          width: var(--sidebar-width-collapsed);
        }

        .sidebar__logo-text,
        .sidebar__nav-item span,
        .sidebar__new-chat span,
        .sidebar__footer-item span {
          display: none;
        }

        .search-results__grid {
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        .session-list__grid {
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }
      }

      @media (max-width: 768px) {
        .app__main {
          margin-left: 0;
          margin-top: var(--header-height);
        }

        .app__mobile-header {
          display: flex;
        }

        .sidebar {
          transform: translateX(-100%);
          width: var(--sidebar-width);
        }

        .sidebar--open {
          transform: translateX(0);
          box-shadow: var(--shadow-xl);
        }

        /* Sidebar overlay backdrop for mobile - behind sidebar content */
        .sidebar--open::before {
          content: "";
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: -1;
          animation: fadeIn 0.2s ease;
          pointer-events: none;
        }

        .sidebar__collapse {
          display: none;
        }

        /* Show text labels on mobile when sidebar is open */
        .sidebar--open .sidebar__logo-text,
        .sidebar--open .sidebar__nav-item span,
        .sidebar--open .sidebar__new-chat span,
        .sidebar--open .sidebar__footer-item span {
          display: inline;
        }

        /* Prevent body scroll when sidebar is open */
        body.sidebar-open {
          overflow: hidden;
        }

        .library-page {
          padding: var(--spacing-md);
        }

        .library-page__header {
          flex-direction: column;
          align-items: flex-start;
          gap: var(--spacing-md);
        }

        .search-results__grid {
          grid-template-columns: 1fr;
        }

        .session-list__grid {
          grid-template-columns: 1fr;
        }

        .model-selector__grid {
          grid-template-columns: 1fr;
        }

        .settings-modal__layout {
          flex-direction: column;
        }

        .settings-modal__tabs {
          flex-direction: row;
          border-right: none;
          border-bottom: 1px solid var(--color-border);
          overflow-x: auto;
          min-width: auto;
        }

        .search-filters__panel {
          flex-direction: column;
        }
      }

      @media (max-width: 480px) {
        :root {
          font-size: 13px;
        }

        .chat-history {
          padding: var(--spacing-md);
        }

        .chat-input {
          padding: var(--spacing-sm);
        }

        .chat-input__textarea {
          font-size: 14px;
        }

        .bot__in {
          font-size: 14px;
          padding: var(--spacing-sm) var(--spacing-md);
        }

        .modal--sm,
        .modal--md,
        .modal--lg,
        .modal--xl {
          max-width: 100%;
          margin: var(--spacing-sm);
        }

        .settings-modal__layout {
          flex-direction: column;
        }

        .settings-modal__tabs {
          flex-direction: row;
          border-right: none;
          border-bottom: 1px solid var(--color-border);
          overflow-x: auto;
          min-width: auto;
        }
      }

      /* ============================================
   Utility Classes
   ============================================ */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ============================================
   Animations
   ============================================ */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideIn {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }

      .text-center {
        text-align: center;
      }
      .text-left {
        text-align: left;
      }
      .text-right {
        text-align: right;
      }

      .flex {
        display: flex;
      }
      .flex-col {
        flex-direction: column;
      }
      .items-center {
        align-items: center;
      }
      .justify-center {
        justify-content: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .gap-sm {
        gap: var(--spacing-sm);
      }
      .gap-md {
        gap: var(--spacing-md);
      }
      .gap-lg {
        gap: var(--spacing-lg);
      }

      /* ============================================
   Docs Page
   ============================================ */
      .docs-page {
        flex: 1;
        overflow-y: auto;
        padding: var(--spacing-2xl);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xl);
      }

      .docs-page__hero {
        display: grid;
        grid-template-columns: minmax(0, 1.8fr) minmax(280px, 0.9fr);
        gap: var(--spacing-xl);
        padding: var(--spacing-2xl);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: var(--radius-xl);
        background:
          radial-gradient(
            circle at top left,
            rgba(0, 201, 167, 0.18),
            transparent 34%
          ),
          linear-gradient(
            145deg,
            rgba(18, 18, 26, 0.96),
            rgba(10, 10, 15, 0.92)
          );
        box-shadow: var(--shadow-lg);
      }

      .docs-page__eyebrow,
      .docs-section__eyebrow {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: var(--radius-full);
        background: var(--color-accent-light);
        color: var(--color-accent);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .docs-page__title {
        margin: var(--spacing-md) 0 var(--spacing-md);
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        color: var(--color-text-primary);
      }

      .docs-page__lead,
      .docs-section__body,
      .docs-group__summary,
      .docs-card__body,
      .docs-step__body,
      .docs-subagent__scope {
        margin: 0;
        color: var(--color-text-secondary);
        line-height: 1.7;
      }

      .docs-page__stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--spacing-md);
        align-content: start;
      }

      .docs-stat {
        padding: var(--spacing-lg);
        border-radius: var(--radius-lg);
        border: 1px solid var(--color-border);
        background: rgba(255, 255, 255, 0.04);
      }

      .docs-stat__value {
        display: block;
        font-size: 2rem;
        font-weight: 700;
        color: var(--color-text-primary);
        letter-spacing: -0.04em;
      }

      .docs-stat__label {
        display: block;
        margin-top: var(--spacing-xs);
        color: var(--color-text-secondary);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .docs-page__jump-nav {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-sm);
      }

      .docs-page__jump-nav a {
        display: inline-flex;
        align-items: center;
        padding: 10px 14px;
        border-radius: var(--radius-full);
        border: 1px solid var(--color-border);
        background: var(--color-bg-secondary);
        color: var(--color-text-primary);
        text-decoration: none;
        transition:
          border-color var(--transition-fast),
          transform var(--transition-fast),
          background var(--transition-fast);
      }

      .docs-page__jump-nav a:hover {
        border-color: var(--color-accent);
        background: var(--color-accent-light);
        transform: translateY(-1px);
      }

      .docs-section,
      .docs-group {
        scroll-margin-top: 80px;
      }

      .docs-section {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-lg);
      }

      .docs-section__header {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: var(--spacing-lg);
        align-items: end;
      }

      .docs-section__title,
      .docs-group__title,
      .docs-card__title,
      .docs-step__title {
        margin: var(--spacing-sm) 0 0;
        color: var(--color-text-primary);
        letter-spacing: -0.03em;
      }

      .docs-section__title {
        font-size: clamp(1.6rem, 2.6vw, 2.4rem);
      }

      .docs-endpoints,
      .docs-examples,
      .docs-groups {
        display: grid;
        gap: var(--spacing-lg);
      }

      .docs-framework-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--spacing-lg);
      }

      .docs-framework-crosscutting {
        display: grid;
        gap: var(--spacing-lg);
      }

      .docs-endpoints {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .docs-examples,
      .docs-creation-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--spacing-lg);
      }

      .docs-card,
      .docs-step,
      .docs-group {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        background: rgba(18, 18, 26, 0.88);
        box-shadow: var(--shadow-md);
      }

      .docs-card {
        padding: var(--spacing-xl);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .docs-card--framework {
        background:
          radial-gradient(
            circle at top right,
            rgba(0, 201, 167, 0.1),
            transparent 45%
          ),
          rgba(18, 18, 26, 0.88);
      }

      .docs-card__eyebrow {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-sm);
        color: var(--color-accent);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 600;
      }

      .docs-card__paths {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-sm);
      }

      .docs-card__paths code {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: var(--radius-full);
        background: var(--color-bg-tertiary);
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .docs-card__list,
      .docs-step__list {
        margin: 0;
        padding-left: 18px;
        color: var(--color-text-secondary);
      }

      .docs-card__list li,
      .docs-step__list li {
        margin-bottom: var(--spacing-sm);
      }

      .docs-card__details {
        border-top: 1px solid var(--color-border);
        padding-top: var(--spacing-md);
      }

      .docs-card__details summary {
        cursor: pointer;
        color: var(--color-text-primary);
        font-weight: 600;
      }

      .docs-card__details-body {
        display: grid;
        gap: var(--spacing-lg);
        margin-top: var(--spacing-lg);
      }

      .docs-card__details-group h4 {
        margin: 0 0 var(--spacing-sm);
        color: var(--color-text-primary);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .docs-page__code {
        margin: 0;
        padding: var(--spacing-lg);
        border-radius: var(--radius-lg);
        background: #06060b;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #d7fff6;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.7;
        overflow-x: auto;
        white-space: pre-wrap;
      }

      .docs-table-wrap {
        overflow-x: auto;
      }

      .docs-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }

      .docs-table th,
      .docs-table td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--color-border);
        vertical-align: top;
      }

      .docs-table th {
        background: rgba(255, 255, 255, 0.04);
        color: var(--color-text-primary);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .docs-table td {
        color: var(--color-text-secondary);
        line-height: 1.6;
        font-size: 13px;
      }

      .docs-table tr:last-child td {
        border-bottom: none;
      }

      .docs-short-grid {
        display: grid;
        gap: var(--spacing-sm);
      }

      .docs-short-card {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--spacing-md);
        background: var(--color-bg-tertiary);
      }

      .docs-short-card--warning {
        border-color: rgba(245, 158, 11, 0.35);
        background: rgba(245, 158, 11, 0.08);
      }

      .docs-short-card--success {
        border-color: rgba(0, 201, 167, 0.35);
        background: rgba(0, 201, 167, 0.08);
      }

      .docs-short-card__title {
        margin: 0 0 6px;
        color: var(--color-text-primary);
        font-size: 14px;
        letter-spacing: -0.02em;
      }

      .docs-short-card__body {
        margin: 0;
        color: var(--color-text-secondary);
        line-height: 1.6;
      }

      .docs-steps {
        display: grid;
        gap: var(--spacing-md);
      }

      .docs-step {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);
        gap: var(--spacing-lg);
        padding: var(--spacing-xl);
      }

      .docs-step__number {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: linear-gradient(
          145deg,
          var(--color-accent),
          rgba(0, 201, 167, 0.35)
        );
        color: #04110d;
        font-size: 1.4rem;
        font-weight: 800;
      }

      .docs-group {
        padding: var(--spacing-xl);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-lg);
      }

      .docs-group__header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--spacing-lg);
      }

      .docs-group__count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 88px;
        padding: 10px 12px;
        border-radius: var(--radius-full);
        background: var(--color-accent-light);
        color: var(--color-accent);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .docs-subagents {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--spacing-md);
      }

      .docs-subagent {
        padding: var(--spacing-lg);
        border-radius: var(--radius-lg);
        background: var(--color-bg-tertiary);
        border: 1px solid var(--color-border);
      }

      .docs-subagent__name {
